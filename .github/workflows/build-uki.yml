name: Build Bifrost UKI & Windows Binary

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish bifroest.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build static release binary
        run: cargo build --release

      - name: Publish bifroest.exe to v0.1.0-experimental release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view v0.1.0-experimental >/dev/null 2>&1; then
            gh release create v0.1.0-experimental \
              --prerelease \
              --title "v0.1.0-experimental (Definitiv-Nicht-Final-Und-Experimentell)" \
              --notes "Automated experimental release containing Windows binary and Unified Kernel Image (bifrost-boot.efi)."
          fi
          gh release upload v0.1.0-experimental target/release/bifroest.exe --clobber

  build-uki:
    name: Build & Publish bifrost-boot.efi
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Run unit tests on Linux
        run: cargo test

      - name: Build static Linux bifroest binaries (musl)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-unknown-linux-musl --bins

      - name: Build Initramfs & extract Alpine Virt Kernel
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work alpine:3.20 sh -c '
            set -e
            apk add --no-cache \
              linux-virt \
              busybox-static \
              apk-tools-static \
              ca-certificates-bundle \
              kmod \
              ntfs-3g \
              ntfs-3g-progs \
              btrfs-progs \
              parted \
              sfdisk \
              util-linux \
              e2fsprogs \
              cpio \
              gzip \
              zstd
            cp /boot/vmlinuz-virt /work/vmlinuz-virt
            sed -i "s/\r$//" /work/tools/make_initramfs.sh
            sh /work/tools/make_initramfs.sh /work/initramfs-bifrost.cpio.gz
          '

      - name: Install systemd UKI tooling & build bifrost-boot.efi
        run: |
          sudo apt-get install -y systemd-ukify systemd-boot-efi binutils
          sed -i 's/\r$//' tools/build_uki.sh
          sh tools/build_uki.sh vmlinuz-virt initramfs-bifrost.cpio.gz bifrost-boot.efi
          ls -lh bifrost-boot.efi

      - name: Upload bifrost-boot.efi artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-boot-uki
          path: bifrost-boot.efi

      - name: Publish bifrost-boot.efi to v0.1.0-experimental release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v0.1.0-experimental >/dev/null 2>&1; then
            gh release create v0.1.0-experimental \
              --prerelease \
              --title "v0.1.0-experimental (Definitiv-Nicht-Final-Und-Experimentell)" \
              --notes "Automated experimental release containing Windows binary and Unified Kernel Image (bifrost-boot.efi)."
          fi
          gh release upload v0.1.0-experimental bifrost-boot.efi target/x86_64-unknown-linux-musl/release/bifroest-linux --clobber
