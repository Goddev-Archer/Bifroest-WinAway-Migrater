[package]
name = "bifroest"
version = "0.1.0"
edition = "2024"

[lib]
name = "bifroest"
path = "src/lib.rs"

[[bin]]
name = "bifroest"
path = "src/main.rs"

[[bin]]
name = "bifroest-linux"
path = "src/bin/bifroest_linux.rs"

[dependencies]
crossterm = "0.29.0"
flate2 = "1.1"
lzma-rs = "0.3.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
tar = "0.4.46"
walkdir = "2.5.0"
zstd = "0.14.3"
